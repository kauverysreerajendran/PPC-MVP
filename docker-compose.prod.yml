# Production-ish stack for small deployments / staging.
# For real production, replace `postgres` and `redis` with managed services
# and delete those blocks (keep the networks).
name: acme-prod

x-image-registry: &registry ${IMAGE_REGISTRY:-ghcr.io/acme}
x-common: &common
  restart: unless-stopped
  env_file: [.env]
  logging:
    driver: json-file
    options: {max-size: "10m", max-file: "3"}

networks:
  edge:
  internal:

volumes:
  postgres-data:
  redis-data:
  sap-postgres-data:
  masterdata-postgres-data:

services:
  nginx:
    <<: *common
    image: nginx:1.27-alpine
    depends_on: [frontend, backend, sap-integration, masterdata]
    ports:
      - "80:80"
      - "443:443"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/prod.conf:/etc/nginx/conf.d/default.conf:ro
      - ./infrastructure/nginx/certs:/etc/nginx/certs:ro
    networks: [edge, internal]

  frontend:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/frontend:${IMAGE_TAG:-latest}
    build: {context: ./frontend, target: runner}
    expose: ["3000"]
    networks: [internal]
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost:3000/api/healthz"]
      interval: 15s
      timeout: 3s
      retries: 5

  backend:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/backend:${IMAGE_TAG:-latest}
    build: {context: ./backend, target: runtime}
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${WEB_CONCURRENCY:-4} -b 0.0.0.0:8000 --max-requests 2000 --max-requests-jitter 200 --graceful-timeout 30
    expose: ["8000"]
    networks: [internal]
    deploy:
      replicas: 3
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8000/readyz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  migrate:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/backend:${IMAGE_TAG:-latest}
    command: alembic upgrade head
    networks: [internal]
    restart: "no"

  # --- SAP Integration microservice + its own database --------------------
  sap-integration:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/sap-integration:${IMAGE_TAG:-latest}
    build: {context: ./services/sap-integration, target: prod}
    environment:
      SAP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sap-postgres:5432/sap_db
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${SAP_WEB_CONCURRENCY:-2} -b 0.0.0.0:8001 --graceful-timeout 30
    expose: ["8001"]
    depends_on: [sap-migrate]
    networks: [internal]
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  sap-migrate:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/sap-integration:${IMAGE_TAG:-latest}
    build: {context: ./services/sap-integration, target: prod}
    environment:
      SAP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@sap-postgres:5432/sap_db
    command: alembic upgrade head
    networks: [internal]
    restart: "no"

  sap-postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: sap_db
    volumes:
      - sap-postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d sap_db"]
      interval: 10s
      timeout: 5s
      retries: 10

  # --- Masterdata microservice + its own database ------------------------
  masterdata:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/masterdata:${IMAGE_TAG:-latest}
    build: {context: ./services/masterdata, target: prod}
    environment:
      MASTERDATA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@masterdata-postgres:5432/masterdata
      MASTERDATA_SAP_API_BASE_URL: http://sap-integration:8001/api/v1/sap
    command: gunicorn app.main:app -k uvicorn.workers.UvicornWorker -w ${MASTERDATA_WEB_CONCURRENCY:-2} -b 0.0.0.0:8002 --graceful-timeout 30
    expose: ["8002"]
    depends_on: [masterdata-migrate]
    networks: [internal]
    deploy:
      replicas: 2
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys;sys.exit(0 if urllib.request.urlopen('http://localhost:8002/healthz').status==200 else 1)"]
      interval: 15s
      timeout: 5s
      retries: 5

  masterdata-migrate:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/masterdata:${IMAGE_TAG:-latest}
    build: {context: ./services/masterdata, target: prod}
    environment:
      MASTERDATA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@masterdata-postgres:5432/masterdata
    command: alembic upgrade head
    networks: [internal]
    restart: "no"

  masterdata-postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: masterdata
    volumes:
      - masterdata-postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d masterdata"]
      interval: 10s
      timeout: 5s
      retries: 10

  celery-worker:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/backend:${IMAGE_TAG:-latest}
    command: celery -A app.workers.celery_app worker -Q default,emails,maintenance -l info --concurrency ${CELERY_CONCURRENCY:-8} --max-tasks-per-child 500
    networks: [internal]
    deploy:
      replicas: 2

  celery-beat:
    <<: *common
    image: ${IMAGE_REGISTRY:-ghcr.io/acme}/backend:${IMAGE_TAG:-latest}
    command: celery -A app.workers.celery_app beat -l info --pidfile=
    networks: [internal]
    deploy:
      replicas: 1

  postgres:
    <<: *common
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER}"]
      interval: 10s
      timeout: 5s
      retries: 10

  redis:
    <<: *common
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [internal]
