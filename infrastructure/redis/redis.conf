# Redis config for cache + broker + locks. Not a database of record.
bind 0.0.0.0
protected-mode yes
port 6379

# Persistence: light AOF so the broker survives a restart; cache is expendable.
appendonly yes
appendfsync everysec
save 900 1
save 300 10

# Memory: cap and evict volatile keys (cache) under pressure; broker keys have no TTL
# so keep them by using volatile-lru (only keys with an expiry are evicted).
maxmemory 512mb
maxmemory-policy volatile-lru

timeout 300
tcp-keepalive 60
databases 16

