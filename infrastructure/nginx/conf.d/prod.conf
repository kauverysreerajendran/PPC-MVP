# HTTP -> HTTPS redirect
server {
    listen 80 default_server;
    server_name _;
    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }
    location / { return 301 https://$host$request_uri; }
}

server {
    listen 443 ssl;
    http2 on;
    server_name _;

    ssl_certificate     /etc/nginx/certs/fullchain.pem;
    ssl_certificate_key /etc/nginx/certs/privkey.pem;
    ssl_protocols TLSv1.2 TLSv1.3;
    ssl_ciphers ECDHE-ECDSA-AES128-GCM-SHA256:ECDHE-RSA-AES128-GCM-SHA256:ECDHE-ECDSA-AES256-GCM-SHA384:ECDHE-RSA-AES256-GCM-SHA384;
    ssl_prefer_server_ciphers off;
    ssl_session_cache shared:SSL:10m;
    ssl_session_timeout 1d;
    ssl_stapling on;
    ssl_stapling_verify on;

    # --- security headers -------------------------------------------------
    add_header Strict-Transport-Security "max-age=31536000; includeSubDomains; preload" always;
    add_header X-Content-Type-Options "nosniff" always;
    add_header X-Frame-Options "DENY" always;
    add_header Referrer-Policy "strict-origin-when-cross-origin" always;
    add_header Permissions-Policy "geolocation=(), microphone=(), camera=()" always;
    add_header Content-Security-Policy "default-src 'self'; img-src 'self' data: blob:; script-src 'self'; style-src 'self' 'unsafe-inline'; connect-src 'self'; frame-ancestors 'none'; base-uri 'self'" always;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # static assets: long cache, served straight from Next.js
    location /_next/static/ {
        proxy_pass http://frontend_upstream;
        proxy_cache_valid 200 60m;
        add_header Cache-Control "public, max-age=31536000, immutable";
    }

    # SAP Integration microservice -> owns /api/v1/sap/*
    location /api/v1/sap/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 30;
        client_max_body_size 10m;
        proxy_pass http://sap_upstream;
    }

    # Masterdata microservice -> owns /api/v1/masterdata/*
    location /api/v1/masterdata/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 30;
        client_max_body_size 10m;
        proxy_pass http://masterdata_upstream;
    }

    # Rack microservice -> owns /api/v1/rack/*
    location /api/v1/rack/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 30;
        client_max_body_size 10m;
        proxy_pass http://rack_upstream;
    }

    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 30;
        client_max_body_size 10m;
        proxy_pass http://backend_upstream;
    }

    # block direct external access to metrics
    location /api/v1/metrics { deny all; return 403; }

    # SAP DB admin (SQLAdmin on the SAP service). Password-gated; add an IP
    # allowlist for prod as with /admin below.
    location /sap-admin {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://sap_upstream;
    }

    # Masterdata DB admin (SQLAdmin on the Masterdata service). Password-gated.
    location /masterdata-admin {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://masterdata_upstream;
    }

    # Rack DB admin (SQLAdmin on the Rack service). Password-gated.
    location /rack-admin {
        limit_req zone=api_rl burst=20 nodelay;
        proxy_pass http://rack_upstream;
    }

    # Django-style DB admin (SQLAdmin) -> FastAPI.
    # Auth is enforced by the app; optionally add an IP allowlist here for prod:
    #   allow 10.0.0.0/8; deny all;
    location /admin {
        limit_req zone=api_rl burst=20 nodelay;
        client_max_body_size 10m;
        proxy_pass http://backend_upstream;
    }

    location / {
        proxy_pass http://frontend_upstream;
    }
}
