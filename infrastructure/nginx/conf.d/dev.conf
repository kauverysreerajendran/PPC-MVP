server {
    listen 80 default_server;
    server_name _;

    location = /healthz { return 200 "ok\n"; add_header Content-Type text/plain; }

    # SAP Integration microservice -> owns /api/v1/sap/*
    location /api/v1/sap/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 20;
        proxy_pass http://sap_upstream;
    }

    # SAP DB admin (SQLAdmin on the SAP service)
    location /sap-admin {
        proxy_pass http://sap_upstream;
    }

    # Masterdata microservice -> owns /api/v1/masterdata/*
    location /api/v1/masterdata/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 20;
        proxy_pass http://masterdata_upstream;
    }

    # Masterdata DB admin (SQLAdmin on the Masterdata service)
    location /masterdata-admin {
        proxy_pass http://masterdata_upstream;
    }

    # Rack microservice -> owns /api/v1/rack/*
    location /api/v1/rack/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 20;
        proxy_pass http://rack_upstream;
    }

    # Rack DB admin (SQLAdmin on the Rack service)
    location /rack-admin {
        proxy_pass http://rack_upstream;
    }

    # API -> FastAPI (monolith / gateway)
    location /api/ {
        limit_req zone=api_rl burst=40 nodelay;
        limit_conn conn_lim 20;
        proxy_pass http://backend_upstream;
    }

    # Django-style DB admin (SQLAdmin) -> FastAPI
    location /admin {
        proxy_pass http://backend_upstream;
    }

    # Next.js HMR websocket
    location /_next/webpack-hmr {
        proxy_pass http://frontend_upstream;
        proxy_set_header Upgrade $http_upgrade;
        proxy_set_header Connection "upgrade";
    }

    # Everything else -> Next.js
    location / {
        proxy_pass http://frontend_upstream;
    }
}
