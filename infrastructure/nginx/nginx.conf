user  nginx;
worker_processes  auto;
worker_rlimit_nofile 65535;

events {
    worker_connections  4096;
    multi_accept on;
}

http {
    include       /etc/nginx/mime.types;
    default_type  application/octet-stream;
    server_tokens off;

    # --- logging: JSON access log with request id ---------------------------
    log_format json_combined escape=json '{'
        '"time":"$time_iso8601",'
        '"remote_addr":"$remote_addr",'
        '"request":"$request",'
        '"status":$status,'
        '"body_bytes_sent":$body_bytes_sent,'
        '"request_time":$request_time,'
        '"upstream_response_time":"$upstream_response_time",'
        '"request_id":"$request_id",'
        '"referer":"$http_referer",'
        '"user_agent":"$http_user_agent"'
    '}';
    access_log /var/log/nginx/access.log json_combined;
    error_log  /var/log/nginx/error.log warn;

    sendfile on;
    tcp_nopush on;
    tcp_nodelay on;
    keepalive_timeout 65;
    types_hash_max_size 4096;
    client_max_body_size 10m;
    client_body_timeout 15s;
    client_header_timeout 15s;
    send_timeout 30s;
    reset_timedout_connection on;

    # --- compression -------------------------------------------------------
    gzip on;
    gzip_vary on;
    gzip_proxied any;
    gzip_comp_level 5;
    gzip_min_length 256;
    gzip_types application/json application/javascript application/xml text/css text/plain image/svg+xml;

    # --- rate limiting (coarse outer guard) ------------------------------------
    limit_req_zone  $binary_remote_addr zone=api_rl:10m rate=20r/s;
    limit_conn_zone $binary_remote_addr zone=conn_lim:10m;
    limit_req_status 429;
    limit_conn_status 429;

    # --- upstreams: DNS round-robin over compose/k8s service names --------
    upstream frontend_upstream {
        zone frontend 64k;
        server frontend:3000 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }
    upstream backend_upstream {
        zone backend 64k;
        server backend:8000 max_fails=3 fail_timeout=15s;
        keepalive 64;
    }
    # SAP Integration microservice (own process + own database).
    upstream sap_upstream {
        zone sap 64k;
        server sap-integration:8001 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }
    # Masterdata microservice (own process + own database).
    upstream masterdata_upstream {
        zone masterdata 64k;
        server masterdata:8002 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }
    # Rack microservice (own process + own database).
    upstream rack_upstream {
        zone rack 64k;
        server rack:8003 max_fails=3 fail_timeout=15s;
        keepalive 32;
    }

    proxy_http_version 1.1;
    proxy_set_header Connection "";
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;
    proxy_set_header X-Request-ID $request_id;
    proxy_connect_timeout 5s;
    proxy_send_timeout 30s;
    proxy_read_timeout 30s;
    proxy_next_upstream error timeout http_502 http_503 http_504;
    proxy_next_upstream_tries 2;

    include /etc/nginx/conf.d/*.conf;
}
