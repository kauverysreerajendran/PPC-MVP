# Local development stack. Hot reload, captured email, no published DB/Redis ports.
name: acme-dev

x-backend-env: &backend-env
  env_file: [.env]

networks:
  edge:
  internal:

volumes:
  postgres-data:
  redis-data:

services:
  nginx:
    image: nginx:1.27-alpine
    depends_on: [frontend, backend, sap-integration, masterdata, rack, status]
    ports:
      - "80:80"
    volumes:
      - ./infrastructure/nginx/nginx.conf:/etc/nginx/nginx.conf:ro
      - ./infrastructure/nginx/conf.d/dev.conf:/etc/nginx/conf.d/default.conf:ro
    networks: [edge, internal]
    healthcheck:
      test: ["CMD", "wget", "-qO-", "http://localhost/healthz"]
      interval: 10s
      timeout: 3s
      retries: 5

  frontend:
    build:
      context: ./frontend
      target: dev
    <<: *backend-env
    command: npm run dev
    volumes:
      - ./frontend:/app
      - /app/node_modules
      - /app/.next
    expose: ["3000"]
    networks: [internal]

  backend:
    build:
      context: ./backend
      target: dev
    <<: *backend-env
    command: uvicorn app.main:app --host 0.0.0.0 --port 8000 --reload
    volumes:
      - ./backend:/app
    expose: ["8000"]
    depends_on:
      postgres: {condition: service_healthy}
      redis: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8000/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- SAP Integration microservice --------------------------------------
  # Shares the single `postgres` database below; its tables live in the
  # `sap` schema (see services/sap-integration/app/models.py: SCHEMA).
  sap-integration:
    build:
      context: ./services/sap-integration
      target: dev
    <<: *backend-env
    environment:
      SAP_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      SAP_STATUS_API_BASE_URL: http://status:8004/api/v1/status
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8001 --reload"
    volumes:
      - ./services/sap-integration:/app
    expose: ["8001"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8001/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Masterdata microservice --------------------------------------------
  # Shares the single `postgres` database below; its tables live in the
  # `masterdata` schema (see services/masterdata/app/models.py: SCHEMA).
  masterdata:
    build:
      context: ./services/masterdata
      target: dev
    <<: *backend-env
    environment:
      MASTERDATA_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      MASTERDATA_SAP_API_BASE_URL: http://sap-integration:8001/api/v1/sap
      MASTERDATA_STATUS_API_BASE_URL: http://status:8004/api/v1/status
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8002 --reload"
    volumes:
      - ./services/masterdata:/app
    expose: ["8002"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8002/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Rack microservice ---------------------------------------------------
  # Shares the single `postgres` database below; its tables live in the
  # `rack` schema (see services/rack/app/models.py: SCHEMA).
  rack:
    build:
      context: ./services/rack
      target: dev
    <<: *backend-env
    environment:
      RACK_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
      RACK_MASTERDATA_API_BASE_URL: http://masterdata:8002/api/v1/masterdata
      RACK_STATUS_API_BASE_URL: http://status:8004/api/v1/status
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8003 --reload"
    volumes:
      - ./services/rack:/app
    expose: ["8003"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8003/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  # --- Status microservice -------------------------------------------------
  # Single source of truth for a SAP line's status per stage. Shares the single
  # `postgres` database; its tables live in the `status` schema.
  status:
    build:
      context: ./services/status
      target: dev
    <<: *backend-env
    environment:
      STATUS_DATABASE_URL: postgresql+asyncpg://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}
    command: >
      sh -c "alembic upgrade head &&
             uvicorn app.main:app --host 0.0.0.0 --port 8004 --reload"
    volumes:
      - ./services/status:/app
    expose: ["8004"]
    depends_on:
      postgres: {condition: service_healthy}
    networks: [internal]
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request,sys; sys.exit(0 if urllib.request.urlopen('http://localhost:8004/healthz').status==200 else 1)"]
      interval: 10s
      timeout: 3s
      retries: 5

  celery-worker:
    build:
      context: ./backend
      target: dev
    <<: *backend-env
    command: celery -A app.workers.celery_app worker -Q default,emails,maintenance -l info --concurrency 4
    volumes:
      - ./backend:/app
    depends_on:
      redis: {condition: service_healthy}
      postgres: {condition: service_healthy}
    networks: [internal]

  celery-beat:
    build:
      context: ./backend
      target: dev
    <<: *backend-env
    command: celery -A app.workers.celery_app beat -l info
    volumes:
      - ./backend:/app
    depends_on:
      redis: {condition: service_healthy}
    networks: [internal]

  postgres:
    image: postgres:16-alpine
    environment:
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      POSTGRES_DB: ${POSTGRES_DB}
    volumes:
      - postgres-data:/var/lib/postgresql/data
      - ./infrastructure/postgres/init:/docker-entrypoint-initdb.d:ro
    networks: [internal]
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U $${POSTGRES_USER} -d $${POSTGRES_DB}"]
      interval: 5s
      timeout: 3s
      retries: 10

  redis:
    image: redis:7-alpine
    command: redis-server /usr/local/etc/redis/redis.conf
    volumes:
      - redis-data:/data
      - ./infrastructure/redis/redis.conf:/usr/local/etc/redis/redis.conf:ro
    networks: [internal]
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  mailhog:
    image: mailhog/mailhog:v1.0.1
    ports:
      - "8025:8025"
    networks: [internal]
