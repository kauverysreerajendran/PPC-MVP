name: CD

on:
  push:
    branches: [main]
    tags: ["v*"]
  workflow_dispatch:

permissions:
  contents: read
  packages: write
  id-token: write # OIDC to the cloud — no long-lived credentials

env:
  REGISTRY: ghcr.io
  IMAGE_PREFIX: ghcr.io/${{ github.repository }}

jobs:
  build-and-scan:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        component: [backend, frontend]
    outputs:
      tag: ${{ steps.meta.outputs.tag }}
    steps:
      - uses: actions/checkout@v4
      - id: meta
        run: echo "tag=${GITHUB_SHA::12}" >> "$GITHUB_OUTPUT"
      - uses: docker/setup-buildx-action@v3
      - uses: docker/login-action@v3
        with:
          registry: ${{ env.REGISTRY }}
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - name: Build & push
        uses: docker/build-push-action@v7
        with:
          context: ./${{ matrix.component }}
          target: ${{ matrix.component == 'backend' && 'runtime' || 'runner' }}
          push: true
          platforms: linux/amd64,linux/arm64
          tags: |
            ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}
            ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:latest
          cache-from: type=gha
          cache-to: type=gha,mode=max
      - name: Trivy scan (fail on HIGH/CRITICAL)
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: ${{ env.IMAGE_PREFIX }}/${{ matrix.component }}:${{ steps.meta.outputs.tag }}
          severity: HIGH,CRITICAL
          exit-code: "1"
          ignore-unfixed: true

  deploy-staging:
    needs: build-and-scan
    runs-on: ubuntu-latest
    environment: staging # secrets scoped to the GitHub Environment
    steps:
      - uses: actions/checkout@v4
      - name: Configure cloud auth (OIDC)
        run: echo "Assume role / workload-identity here; no static keys."
      - name: Run DB migrations
        run: echo "kubectl create job --from=cronjob/migrate ... OR compose run migrate"
      - name: Roll out
        run: echo "kubectl set image / helm upgrade / docker compose pull && up -d"
      - name: Health gate
        run: |
          for i in $(seq 1 30); do
            curl -fsS "$STAGING_URL/readyz" && exit 0 || sleep 5
          done
          exit 1
        env:
          STAGING_URL: ${{ vars.STAGING_URL }}

  deploy-production:
    needs: deploy-staging
    runs-on: ubuntu-latest
    environment: production # requires manual approval (configured on the Environment)
    steps:
      - uses: actions/checkout@v4
      - name: Run DB migrations
        run: echo "migrate (expand/contract, backward compatible)"
      - name: Roll out (rolling, readiness-gated)
        run: echo "helm upgrade --atomic --wait ..."
      - name: Smoke test
        run: curl -fsS "${{ vars.PRODUCTION_URL }}/readyz"
