[project]
name = "acme-backend"
version = "0.1.0"
description = "Acme SaaS API — FastAPI modular monolith"
requires-python = ">=3.12"
readme = "README.md"

[tool.ruff]
line-length = 100
target-version = "py312"
src = ["app", "tests"]

[tool.ruff.lint]
select = ["E", "F", "I", "N", "UP", "B", "C4", "SIM", "ASYNC", "S", "RUF"]
ignore = [
  "S101",   # assert is fine in tests
  "UP042",  # str+Enum is intentional (JSON-serializable enums)
  "UP046",  # keep Generic[T] for pydantic-generic compatibility
  "RUF012", # repository `sortable` maps are effectively constant
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S311"]
"alembic/**" = ["E402", "E501"]  # migrations carry long, generated-style column defs
"app/db/base.py" = ["E402", "F401"]  # models imported for mapper/Alembic registration

[tool.mypy]
python_version = "3.12"
plugins = ["pydantic.mypy"]
strict = true
warn_unused_ignores = true
disallow_untyped_decorators = false
exclude = ["alembic/versions"]

[tool.pytest.ini_options]
addopts = "-ra -q --strict-markers --cov=app --cov-report=term-missing"
asyncio_mode = "auto"
asyncio_default_fixture_loop_scope = "function"
testpaths = ["tests"]
markers = [
  "unit: fast isolated tests",
  "integration: requires Postgres",
  "api: exercises the HTTP layer",
]

[tool.coverage.report]
exclude_lines = ["pragma: no cover", "if TYPE_CHECKING:", "raise NotImplementedError"]
